bot:
  inspection: disabled
build_platform:
  linux_aarch64: linux_64
  osx_arm64: osx_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
github_actions:
  store_build_artifacts: True
provider:
  linux_aarch64: default
  win: azure
test: native_and_emulated
noarch_platforms:
  - linux_64
  - osx_64
azure:
  store_build_artifacts: False  # https://github.com/conda-forge/conda-smithy/issues/2733
remote_ci_setup:
  - 'conda-forge-ci-setup=4'
  - 'mamba<2.10.0'  # https://github.com/conda-forge/conda-libmamba-solver-feedstock/issues/63
