bot:
  inspection: disabled
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  win: azure
  osx_arm64: default
test: native_and_emulated
noarch_platforms:
  - linux_64
  - osx_64
workflow_settings:
  store_build_artifacts: true
