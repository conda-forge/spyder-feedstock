{% set version = "6.2.0a2" %}
{% set python_min = "3.11" %}  # DO NOT REMOVE! This is necessary to build our installers
{% set build = 1 %}

package:
  name: spyder-base
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/spyder/spyder-{{ version }}.tar.gz
  sha256: 40c718edea3dedbdd4d4a1564338e861df53cb50599000c9b32229a260172e36

build:
  number: {{ build }}
  # skip Python 3.10 build on Windows
  skip: true  # [py<311]
  entry_points:
    - spyder = spyder.app.start:main
  osx_is_app: true
  # noarch on Windows fails due to spyder.ico
  # conda_build.exceptions.CondaBuildUserError: Noarch package contains binary script: spyder.ico
  # https://github.com/conda/conda-build/issues/5385
  noarch: python  # [unix]
  string: "osx_pyh{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"    # [osx]
  string: "linux_pyh{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"  # [linux]

requirements:
  build:
    - python >={{ python_min }}           # [unix and (build_platform != target_platform)]
    # Needed to provide a package for each Python version supported by conda-forge on Windows
    - python                              # [win  and (build_platform != target_platform) and py!=3.10]
  host:
    - python {{ python_min }}  # [unix]
    - python                   # [win]
    - pip
    - setuptools
    - packaging
  run:
    - python >={{ python_min }}
    - aiohttp >=3.11.2
    - applaunchservices >=0.3.0  # [osx]
    - asyncssh >=2.14.0,<3.0.0
    - bcrypt >=4.3.0
    - chardet >=5.2.0,<8.0.0
    - cloudpickle >=0.5.0
    - cookiecutter >=1.6.0
    - fzf >=0.42.0
    - intervaltree >=3.0.2
    - ipython >=9.15.0,<10.0.0
    - ipython_pygments_lexers >=1.0
    - jedi >=0.17.2,<0.21.0
    - jellyfish >=0.7
    - jsonschema >=3.2.0
    - keyring >=17.0.0
    - lsprotocol >=2025.0.0,<2026.0.0
    - lxml >=4.9.0
    - markdown-it-py >=3.0.0
    - nbconvert >=4.0
    - numpydoc >=0.6.0
    - openpyxl >=3.0.0
    - packaging >=20.0
    - parso >=0.7.0,<0.9.0
    - pickleshare >=0.4
    - psutil >=5.3
    # This is here to work around a bug in mamba
    - ptyprocess >=0.5  # [win]
    - pygithub >=2.3.0
    - pygls >=2.0.0
    - pygments >=2.0
    - pylint >=3.1,<5
    - pylint-venv >=3.0.2
    - pyls-spyder >=0.4.0
    - python.app  # [osx]
    - python-lsp-black >=2.0.0,<3.0.0
    - python-lsp-ruff >=2.3.0,<3.0.0
    - python-lsp-server >=1.14.0,<1.15.0
    - pyuca >=1.2
    - pyxdg >=0.26  # [linux]
    - pyzmq >=24.0.0
    - qstylizer >=0.2.2
    - qtawesome >=1.4.1,<1.5.0
    - qtconsole-base >=5.7.2,<5.8.0
    - qtpy >=2.4.0
    - rtfunicode >=2.2,<3
    - rtree >=0.9.7
    - sphinx >=7.2.0
    - spyder-kernels >=3.2.0a1,<3.2.0a2
    - spyder-themes >=1.0.9,<1.1.0
    - superqt >=0.6.2,<1.0.0
    - textdistance >=4.2.0
    - three-merge >=0.1.1
    - watchdog >=0.10.3
    - yarl >=1.9.4
    # https://conda-forge.org/docs/maintainer/knowledge_base/#noarch-python
    - __linux  # [linux]
    - __osx    # [osx]
  run_constrained:
    - spyder {{ version }} *{{ build }}

test:
  requires:
    - python {{ python_min }}  # [unix]
    - python                   # [win]
    - pip
  commands:
    - spyder -h
    - python -m pip check
  imports:
    - spyder

app:
  entry: spyder
  icon: spyder.png
  summary: The Scientific Python Development Environment
  type: desk

outputs:
  - name: spyder-base
  - name: spyder
    build:
      noarch: python
      string: "linux_pyh{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"  # [linux]
    requirements:
      run:
        - spyder-base {{ version }} *{{ build }}
        - fcitx-qt5 >=1.2.7  # [linux]
        - pyqt >=5.15,<5.16
        - pyqtwebengine >=5.15,<5.16
        - qtconsole >=5.7.2,<5.8.0
        - __linux  # [linux]
    test:
      requires:
        - python {{ python_min }}  # [unix]
        - python                   # [win]
        - pip
      commands:
        - spyder -h
        - python -m pip check
      imports:
        - spyder

about:
  home: https://www.spyder-ide.org/
  license: MIT
  license_file: LICENSE.txt
  summary: The Scientific Python Development Environment
  description: |
    Spyder is a powerful scientific environment written in Python, for Python,
    and designed by and for scientists, engineers and data analysts.
    It features a unique combination of the advanced editing, analysis,
    debugging and profiling functionality of a comprehensive development tool
    with the data exploration, interactive execution, deep inspection and
    beautiful visualization capabilities of a scientific package.\n
    Furthermore, Spyder offers built-in integration with many popular
    scientific packages, including NumPy, SciPy, Pandas, IPython, QtConsole,
    Matplotlib, SymPy, and more.\n
    Beyond its many built-in features, Spyder can be extended even further via
    third-party plugins.\n
    Spyder can also be used as a PyQt5 extension library, allowing you to build
    upon its functionality and embed its components, such as the interactive
    console or advanced editor, in your own software.
  doc_url: https://docs.spyder-ide.org/
  dev_url: https://github.com/spyder-ide/spyder

extra:
  feedstock-name: spyder
  recipe-maintainers:
    - CAM-Gerlach
    - ccordoba12
    - dalthviz
    - mrclary
